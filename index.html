<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="An AI-assisted web client for constructing and exploring knowledge graphs" />
    <title>Knogra - Knowledge Graph Explorer</title>
    <link rel="stylesheet" href="/src/styles/global.css" />
    <script>
      (function () {
        const hostname = location.hostname;
        const isLocalHost =
          hostname === 'localhost' ||
          hostname === '127.0.0.1' ||
          hostname === '::1' ||
          hostname.endsWith('.local') ||
          /^10\./.test(hostname) ||
          /^192\.168\./.test(hostname) ||
          /^172\.(1[6-9]|2\d|3[0-1])\./.test(hostname);

        if (isLocalHost) return;

        const script = document.createElement('script');
        script.defer = true;
        script.src = '/_vercel/insights/script.js';
        document.head.appendChild(script);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
      }

      #mobile-message {
        display: none;
      }

      @media (max-width: 1024px) {
        #app { display: none !important; }
        #mobile-message {
          display: flex;
          align-items: center;
          justify-content: center;
          min-height: 100vh;
          background: #0d1117;
          padding: 32px;
          text-align: center;
        }
        .mobile-message-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 16px;
          max-width: 320px;
        }
        .mobile-message-content h1 {
          font-size: 1.8rem;
          font-weight: 700;
          color: #e6edf3;
          margin: 0;
        }
        .mobile-message-content p {
          font-size: 1rem;
          color: #8b949e;
          line-height: 1.6;
          margin: 0;
        }
        .mobile-home-link {
          font-size: 0.9rem;
          color: #58a6ff;
          text-decoration: none;
          margin-top: 8px;
        }
      }
      
      #app {
        display: grid;
        grid-template-columns: 0px 1fr 500px;
        grid-template-rows: 52px 1fr 140px;
        width: 100vw;
        height: 100vh;
      }
      
      #app > * {
        background: #161b22;
      }
      
      #path-panel {
        grid-column: 2;
        grid-row: 1;
        background: #0d1117;
        min-height: 0;
        overflow: hidden;
        contain: strict;
      }
      
      #cy {
        grid-column: 2;
        grid-row: 2;
        background: #0d1117;
        overflow: hidden;
        min-width: 0;
      }
      
      #chat {
        grid-column: 3;
        grid-row: 1 / 4;  /* Span all three rows */
        display: flex;
        flex-direction: column;
        overflow: hidden;
        font-size: 16px;  /* Baseline for MathJax ex unit calculation */
        border-left: 1px solid #30363d;
      }
      
      #suggestions {
        grid-column: 2;
        grid-row: 3;
        overflow: hidden;
        background: #0d1117;
      }
      
      .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      
      .message {
        display: flex;
        flex-direction: column;
      }
      
      .message-content {
        font-size: 14px;
        line-height: 1.6;
        color: #e6edf3;
      }
      
      .message.user .message-content {
        background: #2d333b;
        padding: 10px 14px;
        border-radius: 8px;
      }
      
      .message.assistant .message-content {
        color: #c9d1d9;
      }
      
      .chat-input-container {
        padding: 16px 20px;
      }
      
      .chat-input {
        width: 100%;
        background: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        padding: 10px 12px;
        color: #e6edf3;
        font-size: 14px;
        font-family: inherit;
        resize: none;
        outline: none;
      }
      
      .chat-input:focus {
        border-color: #58a6ff;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <div></div>
      <div id="path-panel"></div>
      <div id="cy"></div>
      <div id="chat">
        <div class="chat-messages"></div>
        <div class="chat-input-container">
          <textarea class="chat-input" rows="2" placeholder="Ask about this node..."></textarea>
        </div>
      </div>
      <div id="suggestions"></div>
    </div>

    <div id="mobile-message">
      <div class="mobile-message-content">
        <img src="/logo.svg" alt="Knogra" width="56" height="56" />
        <h1>Knogra</h1>
        <p>Knogra is a desktop application.<br>Please open it on a computer for the full experience.</p>
        <a href="https://knogra.io" class="mobile-home-link">← Back to knogra.io</a>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
